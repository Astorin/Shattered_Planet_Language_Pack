skewer_shattered_planet=La fin, les confins les plus lointains de l’ au delà connu. Un environnement hautement radioactif où les lois mêmes de la physique sont déformées. Les ressources sont rares et presque inexistantes, bien qu’ il semble y avoir des traces de fragments d’astéroïdes locaux sur différentes surfaces. La pression est trop élevée pour permettre un traitement standard des astéroïdes, et les perturbations électromagnétiques rendent l’ utilisation des robots dangereuse.
